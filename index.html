<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my-greeting demo</title>
  <script src="app.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      background: #f1efe8;
      font-family: sans-serif;
    }

    h1 {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888780;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 400px;
    }

    input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      background: #fff;
      color: #2c2c2a;
      outline: none;
    }

    input:focus { border-color: #185fa5; }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <h1>Live playground</h1>

  <div class="controls">
    <input id="inp-name" type="text" placeholder="name…"    value="Gemini" />
    <input id="inp-msg"  type="text" placeholder="message…" value="Hello"  />
  </div>

  <my-greeting id="live" name="Gemini" message="Hello"></my-greeting>

  <h1>Static examples</h1>

  <div class="stack">
    <my-greeting name="World"></my-greeting>
    <my-greeting name="Alice"  message="Welcome"></my-greeting>
    <my-greeting name="Gemini" message="Hey there"></my-greeting>
  </div>

  <script>
    const live = document.getElementById('live');
    document.getElementById('inp-name').addEventListener('input', e => live.setAttribute('name',    e.target.value || 'World'));
    document.getElementById('inp-msg') .addEventListener('input', e => live.setAttribute('message', e.target.value || 'Hello'));
  </script>

</body>
</html>
